<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Crush the Castle 2</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: black;
}

#game-container {
    width: 100vw;
    height: 100vh;
}
</style>
</head>

<body>
    <div id="game-container">
        <object
            type="application/x-shockwave-flash"
            data="crushthecastle2.swf"
            width="100%"
            height="100%"
        >
            <param name="movie" value="crushthecastle2.swf">
            <param name="allowFullScreen" value="true">
            <param name="wmode" value="direct">
        </object>
    </div>
</body>
</html>
