<!DOCTYPE html>
<html>

<head>
    <script>
        const SAVE_KEY = "jetpackjoyride_save";

        window.ytgame = {
            system: {
                isAudioEnabled: () => true,
                onAudioEnabledChange: () => {},
                onPause: () => {},
                onResume: () => {},
                getLanguage: () => Promise.resolve("en"),
                getEnvironment: () => Promise.resolve("web"),
                trackEvent: () => {},
                trackScreen: () => {},
                log: () => {},
            },

            game: {
                loadData: () => {
                    return Promise.resolve(
                        localStorage.getItem(SAVE_KEY) || ""
                    );
                },

                saveData: (data) => {
                    localStorage.setItem(SAVE_KEY, data);
                    return Promise.resolve();
                },

                firstFrameReady: () => {},
                gameReady: () => {},
                pause: () => {},
                resume: () => {},
            }
        };
    </script>
    <!-- Import map -->
    <script src="src/import-map.json" type="systemjs-importmap" charset="utf-8" nonce="oS4dxTnYB3FjM5okaIntiA"> </script>

    <!-- #FASTLIB# -->
    <script defer src="fastLib/importer.js" data-fast="fastLib/fastHeader.js" type="text/javascript" nonce="oS4dxTnYB3FjM5okaIntiA"></script>
</head>

<body>
    <div id="GameDiv">
        <div id="Cocos3dGameContainer">
            <canvas id="GameCanvas"></canvas>
        </div>
    </div>

    <!-- start-fast-library -->
    <script type="text/javascript" nonce="oS4dxTnYB3FjM5okaIntiA">
        document.addEventListener('fastloaded', function(e) {
            window.fast.gameReady = function() {
                window.fast.goGame({
                    prepare: prepareGame,
                    head: ['style.css'],
                    body: ["src/polyfills.bundle.js", "src/system.bundle.js"],
                    init: function() {
                        window.gameStart()
                    },
                    resize: function() {
                        window.fastResizeCanvas()
                    },
                    //docvisible:function(){ window.pauseMeSoftly(), window.fastManageAudioContext() }
                });
                console.log("inside [gameReady] -> " + window.fast.lang);
            }
            window.fast.stageElements(window.fast.gameReady, {
                fsbehind: true,
                nostats: true
            });
        }, false);
    </script>
    <!-- end-fast-library -->

    <script nonce="oS4dxTnYB3FjM5okaIntiA">
        async function prepareGame() {
            // enable audio by default
            window.fast.gameAudio = true;

            // force language
            window.fast.lang = window.fast.info.languages ?
                window.fast.info.languages[0] :
                "en";
        }

        //onchangeaudio
        Object.defineProperty(document, "hidden", {
            get: () => false
        });
        Object.defineProperty(document, "visibilityState", {
            get: () => "visible"
        });
        document.hasFocus = () => true;
        window.gameStart = function() {
            // Inject save BEFORE game loads
            window.gameSaveData =
                localStorage.getItem(SAVE_KEY) || "";

            window.fast.gmg.create();
            System.import('./index.js').catch(console.error);
        };
    </script>
</body>

</html>
