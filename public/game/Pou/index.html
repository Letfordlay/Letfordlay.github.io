<!DOCTYPE html>
<html>

<head>
    <link rel="stylesheet" href="assets/css/app.css" type="text/css" nonce="wHg0caMYl5WlyID1IrUMlQ" />

    <!-- #FASTLIB# -->
    <script defer src="fastLib/importer.js" data-fast="fastLib/fastHeader.js" data-fast-options="{'checkbrowser':false}" type="text/javascript" nonce="wHg0caMYl5WlyID1IrUMlQ"></script>
</head>

<body>
    <div id="content"> </div>
    <div id="orientation"></div>

    <!-- start-fast-library -->
    <script type="text/javascript" nonce="wHg0caMYl5WlyID1IrUMlQ">
        document.addEventListener('fastloaded', function(e) {
            window.fast.gameReady = function() {
                window.fast.goGame({
                    prepare: prepareGame,
                    body: ["vendor/phaser.min.js", "vendor/box2d-p3.min.js", "pou.min.js"],
                    init: function() {
                        window.gameStart(), window.fastActivePopup(), ytgame.game.firstFrameReady()
                    },
                    enterfs: function() {},
                    exitfs: function() {},
                    afterinfs: function() {
                        window.fastCheckMiniGameForMiui(true)
                    }
                });
                console.log("inside [gameReady] -> " + window.fast.lang);
            }
            window.fast.stageElements(window.fast.gameReady, {
                fsbehind: true,
                nostats: true
            });
        }, false);
    </script>
    <!-- end-fast-library -->
    <script nonce="wHg0caMYl5WlyID1IrUMlQ">
        async function prepareGame() {
            //check audio
            window.fast.gameAudio = ytgame.system.isAudioEnabled();
            //check lang
            await ytgame.system.getLanguage().then(function(lang) {
                //strip the subtag and default to english if not supported
                lang = lang.split('-')[0];
                lang = (window.fast.info.languages.indexOf(lang) > -1) ? lang : window.fast.info.languages[0];
                console.log('set lang to ' + lang);
                window.fast.lang = lang;
                return new Promise((resolve, reject) => {
                    resolve()
                });
            });
        }
        //onchangeaudio
        ytgame.system.onAudioEnabledChange(function(isAudioEnabled) {
            if (window.fast) window.fast.gameAudio = isAudioEnabled;
            if (typeof window.fastEnableAudio === "function") window.fastEnableAudio(isAudioEnabled);
        });
    </script>
</body>

</html>
