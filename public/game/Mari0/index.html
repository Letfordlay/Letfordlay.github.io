<!DOCTYPE html>
<html lang="en-us">
<head>
<meta charset="utf-8">

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: black;
}

/* main game canvas */
#canvas {
    width: 100vw;
    height: 100vh;
    display: block;
    background: black;
}

/* loading screen canvas */
#loadingCanvas {
    width: 100vw;
    height: 100vh;
    display: block;
}
</style>
</head>

<body>

<canvas id="canvas" oncontextmenu="event.preventDefault()"></canvas>
<canvas id="loadingCanvas" oncontextmenu="event.preventDefault()"></canvas>

<script>
window.addEventListener("keydown", function(e) {
  if ([32, 37, 38, 39, 40].includes(e.keyCode)) {
    e.preventDefault();
  }
}, false);

var loadingContext = document.getElementById('loadingCanvas').getContext('2d');

function drawLoadingText(text) {
  const canvas = loadingContext.canvas;
  loadingContext.fillStyle = 'white';
  loadingContext.fillRect(0, 0, canvas.width, canvas.height);

  loadingContext.font = '2em arial';
  loadingContext.textAlign = 'center';
  loadingContext.fillStyle = 'black';
  loadingContext.fillText(text, canvas.width / 2, canvas.height / 2);
}

var Module = {
  arguments: ['./'],
  printErr: console.error.bind(console),
  canvas: document.getElementById('canvas'),
  memoryInitializerPrefixURL: '../',

  setStatus: function(text) {
    if (text) {
      drawLoadingText(text);
    } else {
      document.getElementById('loadingCanvas').style.display = 'none';
      document.getElementById('canvas').style.display = 'block';
      Module.callMain(Module.arguments);
    }
  },

  monitorRunDependencies: function(left) {
    Module.setStatus(left ? 'Preparing…' : 'All downloads complete.');
  }
};

Module.setStatus('Downloading…');
</script>

<script src="./index_files/game.js.download"></script>
<script async src="./index_files/love.js.download"></script>

</body>
</html>
