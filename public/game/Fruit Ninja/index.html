    <!-- 2. ytgame stub -->
    <script>
        /**
         * Full ytgame compatibility stub
         * Allows YT-Playables-built games to run standalone / in iframe
         */
        window.ytgame = {
            system: {
                // audio / state
                isAudioEnabled: () => true,
                onAudioEnabledChange: () => {},

                // lifecycle
                onPause: () => {},
                onResume: () => {},

                // visibility / environment
                getLanguage: () => Promise.resolve("en"),
                getEnvironment: () => Promise.resolve("web"),

                // analytics (no-ops)
                trackEvent: () => {},
                trackScreen: () => {},
                log: () => {},
            },

            game: {

                // lifecycle hooks REQUIRED by this build
                firstFrameReady: () => {},
                gameReady: () => {},

                // pause / resume
                pause: () => {},
                resume: () => {},
            }
        };
(function () {
    const SAVE_KEY = "fruitninja_save";

    window.ytgame = {
        system: {
            isAudioEnabled: () => true,
            onAudioEnabledChange: () => {},
            onPause: () => {},
            onResume: () => {},
            getLanguage: () => Promise.resolve("en"),
            getEnvironment: () => Promise.resolve("web"),
            trackEvent: () => {},
            trackScreen: () => {},
            log: () => {},
        },

        game: {
            loadData: () => {
                return new Promise((resolve) => {
                    let data = "";
                    try {
                        data = localStorage.getItem(SAVE_KEY) || "";
                    } catch {}

                    // 🔴 THIS is what the engine actually reads
                    window.gameSaveData = data;

                    resolve(data);
                });
            },

            saveData: (data) => {
                return new Promise((resolve) => {
                    try {
                        if (typeof data === "string") {
                            localStorage.setItem(SAVE_KEY, data);
                        }
                    } catch {}
                    resolve();
                });
            },

            firstFrameReady: () => {},
            gameReady: () => {},
            pause: () => {},
            resume: () => {},
        }
    };
})();
    </script>

	<script nonce="agz7V9dS0hcLnHzNHp2D-A">
		async function prepareGame() {
            // enable audio by default
            window.fast.gameAudio = true;

            // force language
            window.fast.lang = window.fast.info.languages ?
                window.fast.info.languages[0] :
                "en";
        }
		//onchangeaudio
        Object.defineProperty(document, "hidden", {
            get: () => false
        });
        Object.defineProperty(document, "visibilityState", {
            get: () => "visible"
        });
        document.hasFocus = () => true;
        window.gameStart = async function() {
    await window.ytgame.game.loadData(); // 🔴 MUST happen first
    window.fast.gmg.create();
    System.import('./index.js').catch(console.error);
}
