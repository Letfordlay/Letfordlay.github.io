<!DOCTYPE html>
<html>

<head>
    <script>
        (function() {
            const SAVE_KEY = "fruitninja_save";

            window.ytgame = {
                system: {
                    isAudioEnabled: () => true,
                    onAudioEnabledChange: () => {},
                    onPause: () => {},
                    onResume: () => {},
                    getLanguage: () => Promise.resolve("en"),
                    getEnvironment: () => Promise.resolve("web"),
                    trackEvent: () => {},
                    trackScreen: () => {},
                    log: () => {},
                },

                game: {
                    loadData: () => {
                        return new Promise((resolve) => {
                            let data = "";
                            try {
                                data = localStorage.getItem(SAVE_KEY) || "";
                            } catch {}

                            window.gameSaveData = data;

                            resolve(data);
                        });
                    },

                    saveData: (data) => {
                        return new Promise((resolve) => {
                            try {
                                if (typeof data === "string") {
                                    localStorage.setItem(SAVE_KEY, data);
                                }
                            } catch {}
                            resolve();
                        });
                    },

                    firstFrameReady: () => {},
                    gameReady: () => {},
                    pause: () => {},
                    resume: () => {},
                }
            };
        })();
    </script>
    <!-- Import map -->
    <script src="src/import-map.json" type="systemjs-importmap" charset="utf-8" nonce="agz7V9dS0hcLnHzNHp2D-A"> </script>

    <!-- #FASTLIB# -->
    <script defer src="fastLib/importer.js" data-fast="fastLib/fastHeader.js" type="text/javascript" nonce="agz7V9dS0hcLnHzNHp2D-A"></script>
</head>

<body>
    <div id="GameDiv">
        <div id="Cocos3dGameContainer">
            <canvas id="GameCanvas"></canvas>
        </div>
    </div>

    <!-- start-fast-library -->
    <script type="text/javascript" nonce="agz7V9dS0hcLnHzNHp2D-A">
        document.addEventListener('fastloaded', function(e) {
            window.fast.gameReady = function() {
                window.fast.goGame({
                    prepare: prepareGame,
                    head: ['style.css'],
                    body: ["src/polyfills.bundle.js", "src/system.bundle.js"],
                    init: function() {
                        window.gameStart()
                    },
                    resize: function() {
                        window.fastResizeCanvas()
                    },
                    //docvisible:function(){ window.pauseMeSoftly(), window.fastManageAudioContext() }
                });
                console.log("inside [gameReady] -> " + window.fast.lang);
            }
            window.fast.stageElements(window.fast.gameReady, {
                fsbehind: true,
                nostats: true
            });
        }, false);
    </script>
    <!-- end-fast-library -->

    <script nonce="agz7V9dS0hcLnHzNHp2D-A">
        async function prepareGame() {
            // enable audio by default
            window.fast.gameAudio = true;

            // force language
            window.fast.lang = window.fast.info.languages ?
                window.fast.info.languages[0] :
                "en";
        }
        //onchangeaudio
        Object.defineProperty(document, "hidden", {
            get: () => false
        });
        Object.defineProperty(document, "visibilityState", {
            get: () => "visible"
        });
        document.hasFocus = () => true;
        window.gameStart = async function() {
            await window.ytgame.game.loadData();
            window.fast.gmg.create();
            System.import('./index.js').catch(console.error);
        }
    </script>
</body>

</html>
